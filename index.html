<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Salimos?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Una sola tarjeta centrada que cambia de paso; corazones flotando en canvas detrás. Look único rosa (sin modo oscuro, a propósito). */
:root{
  --bg1:#f5f2f4; --bg2:#e6e0e8; --card:#ffffff; --ink:#2b2230; --muted:#6e6274;
  --rose:#b8345a; --rose-d:#93264a; --soft:#f5eef1; --line:#e2d7de;
  --display:"Yeseva One", Georgia, serif; --body:"Nunito", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:var(--body);font-size:17px;overflow-x:hidden}
#hearts{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding-inline:16px;padding-block:24px;box-sizing:border-box}
.card{width:100%;max-width:440px;background:var(--card);border-radius:28px;box-shadow:0 20px 60px -24px rgba(43,34,48,.35);padding:32px 24px 28px;box-sizing:border-box;text-align:center;position:relative}
.step{display:flex;flex-direction:column;gap:18px;animation:in .45s ease both}
@keyframes in{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2.1rem;color:var(--rose-d)}
h2{font-size:1.6rem;color:var(--rose-d)}
p{margin:0;color:var(--muted)}
.big{font-size:3.2rem;line-height:1}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--rose)}
button{font:inherit;cursor:pointer;border:0}
.btn{background:var(--rose);color:#fff;font-weight:800;padding:14px 22px;border-radius:999px;font-size:1.05rem;transition:transform .15s, background .15s}
.btn:hover{background:var(--rose-d);transform:scale(1.03)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--soft);color:var(--rose-d)}
.btn:focus-visible,input:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.answers{position:relative;height:220px;border-radius:20px;background:var(--soft)}
#yes{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1}
#yes.grow{transform:translate(-50%,-50%) scale(1.2)}
#no{position:absolute;left:0;top:0;z-index:2;white-space:nowrap;background:#fff;color:var(--ink);border:2px solid var(--line);touch-action:none}
label{font-weight:800;color:var(--ink);text-align:left;display:block;margin-bottom:6px}
.field{text-align:left}
input[type=date],input[type=time],input[type=text]{width:100%;box-sizing:border-box;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px}
input:focus{border-color:var(--rose);outline:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 4px;font-weight:800;font-size:.78rem;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s}
.chip span{font-size:1.6rem}
@media (max-width:360px){.chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chip{min-width:0;overflow-wrap:anywhere;font-size:.72rem}
.cal{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head strong{font-family:var(--display);font-weight:400;color:var(--rose-d);font-size:1.15rem;text-transform:capitalize}
.nav{background:var(--soft);color:var(--rose-d);width:36px;height:36px;border-radius:50%;font-size:1.4rem;line-height:1;font-weight:800}
.nav:disabled{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-grid em{font-style:normal;font-size:.75rem;font-weight:800;color:var(--muted);padding-block:4px}
.day{aspect-ratio:1;border-radius:50%;background:transparent;color:var(--ink);font-weight:600;max-width:100%}
.day:hover:not(:disabled){background:var(--soft)}
.day:disabled{color:var(--line);cursor:default}
.day.today{box-shadow:inset 0 0 0 2px var(--line)}
.day.sel{background:var(--rose);color:#fff;font-weight:800}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hour{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 8px;font-weight:700;font-size:.85rem;color:var(--ink);white-space:nowrap}
.hour i{flex:none;width:16px;height:16px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff}
.hour[aria-checked=true]{border-color:var(--rose);background:var(--soft);color:var(--rose-d)}
.hour[aria-checked=true] i{background:var(--rose);border-color:var(--rose)}
.hour[aria-checked=true] i::after{content:"✓"}
.status{font-weight:800;color:var(--rose-d)}
.day:focus-visible,.hour:focus-visible,.nav:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.chip[aria-pressed=true]{border-color:var(--rose);background:var(--soft);color:var(--rose-d);transform:scale(1.03)}

<script>
/* ====== CONFIGURA AQUÍ ======
   Tu número de WhatsApp con lada de país, solo dígitos (ej. "524611234567").
   También puedes ponerlo al final del link:  ...artifact/xxxx#524611234567
   Si lo dejas vacío, ella podrá elegirte como contacto al enviar. */
const TELEFONO = "4151147544";
const CORREO = "adrian17ramirezm@gmail.com";
/* ============================ */

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hashNum = (location.hash || "").replace(/\D/g, "");
const PHONE = hashNum.length >= 10 ? hashNum : TELEFONO.replace(/\D/g, "");

const state = { step: 0, fecha: "", hora: "", lugar: "", punto: "", plan: [], comida: [], noTries: 0 };
const card = document.getElementById("card");
const FOODS = [["🍕","Pizza"],["🍔","Hamburguesa"],["🍣","Sushi"],["🌮","Tacos"],["🍝","Pasta"],["🍗","Alitas"],
  ["🥩","Carne asada"],["🍜","Ramen"],["🌯","Burritos"],["🌭","Hot dogs"],["🥗","Ensalada"],["🍤","Mariscos"],
  ["🍦","Helado"],["🍰","Pastel"],["🧇","Crepas"],["☕","Café"]];
const ACTS = [["🚶","Caminar"],["🎬","Ir al cine"],["🍽️","Comer"]];
const HOURS = ["10:00 am","11:00 am","12:00 pm","1:00 pm","2:00 pm","3:00 pm","4:00 pm","5:00 pm","6:00 pm","7:00 pm","8:00 pm","9:00 pm"];

function dots(n){ return '<div class="dots">' + [1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join("") + "</div>"; }
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function render(){
  const s = state.step;
  if (s === 0) {
    card.innerHTML = `<div class="step">
      <div class="big">❤️</div>
      <h1>¿Aceptas salir conmigo?</h1>
      <p>?</p>
      <div class="answers" id="ans">
        <button class="btn" id="yes">Sí</button>
        <button class="btn" id="no">No</button>
      </div></div>`;
    const no = document.getElementById("no"), ans = document.getElementById("ans"), yes = document.getElementById("yes");
    yes.onclick = () => go(1);
    // El "No" está en movimiento desde el inicio y rebota por toda el área
    const p = { x: 0, y: 0, vx: 2.2, vy: 1.6 };
    const bounds = () => ({ mx: Math.max(0, ans.clientWidth - no.offsetWidth), my: Math.max(0, ans.clientHeight - no.offsetHeight) });
    { const b = bounds(); p.x = b.mx; p.y = b.my / 2; }
    no.style.right = "auto";
    const place = () => { no.style.left = p.x + "px"; no.style.top = p.y + "px"; };
    place();
    const loop = () => {
      if (state.step !== 0 || !no.isConnected) return;
      const b = bounds();
      p.x += p.vx; p.y += p.vy;
      if (p.x <= 0 || p.x >= b.mx) { p.vx *= -1; p.x = Math.min(Math.max(p.x, 0), b.mx); }
      if (p.y <= 0 || p.y >= b.my) { p.vy *= -1; p.y = Math.min(Math.max(p.y, 0), b.my); }
      place();
      requestAnimationFrame(loop);
    };
    if (!reduce) requestAnimationFrame(loop);
    // Cada vez que intenta tocarlo, salta lejos y se mueve más rápido
    const msgs = ["¿Segura? 🥺","Piénsalo otra vez","No me alcanzas 😜","Ese botón no funciona 😅","Mejor di que sí 💕","Jajaja casi 🙈"];
    const dodge = (e) => {
      e && e.preventDefault();
      state.noTries++;
      no.textContent = msgs[(state.noTries - 1) % msgs.length];
      yes.classList.add("grow");
      const b = bounds();
      p.x = Math.random() * b.mx; p.y = Math.random() * b.my;
      const sp = Math.min(2.2 + state.noTries * 0.6, 7);
      const ang = Math.random() * Math.PI * 2;
      p.vx = Math.cos(ang) * sp; p.vy = Math.sin(ang) * sp || 1;
      place();
    };
    no.addEventListener("mouseenter", dodge);
    no.addEventListener("touchstart", dodge, {passive:false});
    no.addEventListener("pointerdown", dodge);
    // Si de milagro logra darle clic, cuenta como "Sí" 😏
    no.addEventListener("click", () => go(1));
  }
  if (s === 1) {
    card.innerHTML = `<div class="step">${dots(1)}
      <div class="big">📅</div>
      <h2>Elige el día y la hora de nuestro encuentro</h2>
      <div class="cal" id="cal"></div>
      <div class="field"><label>Hora</label>
        <div class="hours" id="hours">${HOURS.map(h=>`<button class="hour" role="checkbox" aria-checked="${state.hora===h}" data-h="${h}"><i></i>${h}</button>`).join("")}</div>
      </div>
      <button class="btn" id="next" disabled>Siguiente 💕</button></div>`;
    const n = document.getElementById("next");
    const chk = () => { n.disabled = !(state.fecha && state.hora); };
    drawCal(chk);
    card.querySelectorAll(".hour").forEach(b => b.onclick = () => {
      state.hora = b.dataset.h;
      card.querySelectorAll(".hour").forEach(x => x.setAttribute("aria-checked", x === b));
      chk();
    });
    chk();
    n.onclick = () => go(2);
  }
  if (s === 2) {
    card.innerHTML = `<div class="step">${dots(2)}
      <div class="big">📍</div>
      <h2>Escribe el lugar donde quieres que nos veamos</h2>
      <div class="field"><label for="lugar">Lugar</label><input type="text" id="lugar" maxlength="120" placeholder="Ej. el centro, una cafetería, el cine…" value="${esc(state.lugar)}"></div>
      <div class="field"><label for="punto">Punto de reunión</label><input type="text" id="punto" maxlength="120" placeholder="Ej. afuera de la iglesia, en la entrada…" value="${esc(state.punto)}"></div>
      <button class="btn" id="next" disabled>Siguiente 💕</button></div>`;
    const l = document.getElementById("lugar"), pt = document.getElementById("punto"), n = document.getElementById("next");
    const chk = () => { state.lugar = l.value.trim(); state.punto = pt.value.trim(); n.disabled = !(state.lugar && state.punto); };
    l.oninput = pt.oninput = chk; chk(); l.focus();
    pt.onkeydown = (e) => { if (e.key === "Enter" && !n.disabled) go(3); };
    n.onclick = () => go(3);
  }
  if (s === 3) {
    card.innerHTML = `<div class="step">${dots(3)}
      <h2>¿Qué te gustaría hacer?</h2>
      <p class="small">Puedes elegir más de una 😊</p>
      <div class="chips acts">${ACTS.map(([e,t])=>`<button class="chip" aria-pressed="${state.plan.includes(t)}" data-f="${t}"><span>${e}</span>${t}</button>`).join("")}</div>
      <button class="btn" id="next" disabled>Siguiente 💕</button></div>`;
    const n = document.getElementById("next");
    const upd = () => {
      n.disabled = !state.plan.length;
      n.textContent = state.plan.includes("Comer") ? "Siguiente 💕" : "Enviar 💌";
    };
    card.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      const t = c.dataset.f, i = state.plan.indexOf(t);
      i >= 0 ? state.plan.splice(i,1) : state.plan.push(t);
      c.setAttribute("aria-pressed", i < 0);
      upd();
    });
    upd();
    n.onclick = () => { if (state.plan.includes("Comer")) go(4); else { state.comida = []; go(5); } };
  }
  if (s === 4) {
    card.innerHTML = `<div class="step">${dots(4)}
      <h2>¿Qué quieres comer?</h2>
      <p class="small">Puedes elegir más de una 😋</p>
      <div class="chips">${FOODS.map(([e,t])=>`<button class="chip" aria-pressed="${state.comida.includes(t)}" data-f="${t}"><span>${e}</span>${t}</button>`).join("")}</div>
      <button class="btn" id="next" ${state.comida.length?"":"disabled"}>Enviar 💌</button></div>`;
    const n = document.getElementById("next");
    card.querySelectorAll(".chip").forEach(c => c.onclick = () => {
      const t = c.dataset.f, i = state.comida.indexOf(t);
      i >= 0 ? state.comida.splice(i,1) : state.comida.push(t);
      c.setAttribute("aria-pressed", i < 0);
      n.disabled = !state.comida.length;
    });
    n.onclick = () => go(5);
  }
  if (s === 5) {
    burst = 60;
    const txt = resumen();
    const wa = PHONE ? `https://wa.me/${PHONE}?text=${encodeURIComponent(txt)}` : `https://wa.me/?text=${encodeURIComponent(txt)}`;
    const gm = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(CORREO)}&su=${encodeURIComponent("💕 ¡Tenemos cita!")}&body=${encodeURIComponent(txt)}`;
    card.innerHTML = `<div class="step">
      <h1>¡Perfecto! Ya tenemos nuestra cita 💕</h1>
      <p class="frase">Gracias por decir que sí. Desde hoy, contar los días hasta verte es mi parte favorita ✨</p>
      <div class="summary">
        <div><b>Día</b><span>${esc(fechaBonita())}</span></div>
        <div><b>Hora</b><span>${esc(state.hora)}</span></div>
        <div><b>Lugar</b><span>${esc(state.lugar)}</span></div>
        <div><b>Punto</b><span>${esc(state.punto)}</span></div>
        <div><b>Plan</b><span>${esc(state.plan.join(", "))}</span></div>
        ${state.comida.length ? `<div><b>Comida</b><span>${esc(state.comida.join(", "))}</span></div>` : ""}
      </div>
      <p id="status" class="status">Enviando tu respuesta… 💌</p>
      <div class="actions" id="manual" hidden>
        <p><b style="color:var(--ink)">Último paso:</b> mándame tu respuesta para que me llegue 👇</p>
        <a class="btn" href="${wa}" target="_blank" rel="noopener" style="text-decoration:none">Enviar por WhatsApp 💬</a>
        <a class="btn ghost" href="${gm}" target="_blank" rel="noopener" style="text-decoration:none">Enviar por Gmail ✉️</a>
        <button class="btn ghost" id="copy">Copiar mensaje 📋</button>
        <p class="small" id="copied" hidden>Copiado. Pégalo en Instagram o donde quieras 💌</p>
      </div></div>`;
    document.getElementById("copy").onclick = async () => {
      try { await navigator.clipboard.writeText(txt); }
      catch { const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand("copy")}catch{} t.remove(); }
      document.getElementById("copied").hidden = false;
    };
    notificar(txt);
  }
}

/* Aviso automático por correo (FormSubmit). Funciona cuando la página está
   publicada en un hosting normal (GitHub Pages, Netlify…). Si no se puede,
   aparecen los botones para enviarlo a mano. */
async function notificar(txt){
  const st = document.getElementById("status"), man = document.getElementById("manual");
  try {
    const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch("https://formsubmit.co/ajax/" + CORREO, {
      method: "POST", signal: ctrl.signal,
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ _subject: "💕 ¡Dijo que SÍ! Ya tienen cita", _template: "box", _captcha: "false",
        Respuesta: "¡Sí acepto!", Dia: fechaBonita(), Hora: state.hora, Lugar: state.lugar,
        Punto_de_reunion: state.punto, Plan: state.plan.join(", "), Comida: state.comida.join(", ") || "—", Intentos_de_decir_no: String(state.noTries) })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || String(j.success) === "false") throw new Error("no enviado");
    st.textContent = "✅ ¡Listo! Ya me llegó tu respuesta. Nos vemos 💕";
    if (PHONE) { man.hidden = false; man.querySelector("p").innerHTML = "Si quieres, también mándamelo por WhatsApp 👇"; }
  } catch {
    st.hidden = true; man.hidden = false;
  }
}

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
let calView = null;
function drawCal(onPick){
  const el = document.getElementById("cal");
  const today = new Date(); today.setHours(0,0,0,0);
  if (!calView) calView = new Date(today.getFullYear(), today.getMonth(), 1);
  const y = calView.getFullYear(), m = calView.getMonth();
  const first = (new Date(y, m, 1).getDay() + 6) % 7; // lunes primero
  const days = new Date(y, m + 1, 0).getDate();
  const canPrev = new Date(y, m, 1) > new Date(today.getFullYear(), today.getMonth(), 1);
  let cells = "";
  for (let i = 0; i < first; i++) cells += "<span></span>";
  for (let d = 1; d <= days; d++) {
    const dt = new Date(y, m, d), iso = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const past = dt < today;
    cells += `<button class="day${iso===state.fecha?" sel":""}${dt.getTime()===today.getTime()?" today":""}" data-d="${iso}" ${past?"disabled":""}>${d}</button>`;
  }
  el.innerHTML = `<div class="cal-head">
      <button class="nav" id="prev" ${canPrev?"":"disabled"} aria-label="Mes anterior">‹</button>
      <strong>${MESES[m]} ${y}</strong>
      <button class="nav" id="nxt" aria-label="Mes siguiente">›</button></div>
    <div class="cal-grid">${["L","M","M","J","V","S","D"].map(x=>`<em>${x}</em>`).join("")}${cells}</div>`;
  el.querySelector("#prev").onclick = () => { calView = new Date(y, m - 1, 1); drawCal(onPick); };
  el.querySelector("#nxt").onclick = () => { calView = new Date(y, m + 1, 1); drawCal(onPick); };
  el.querySelectorAll(".day").forEach(b => b.onclick = () => { state.fecha = b.dataset.d; drawCal(onPick); onPick(); });
}
function fechaBonita(){
  if (!state.fecha) return "";
  const [y,m,d] = state.fecha.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function resumen(){
  return `💕 ¡Sí acepto salir contigo! 💕\n\n📅 Día: ${fechaBonita()}\n⏰ Hora: ${state.hora}\n📍 Lugar: ${state.lugar}\n🚩 Punto de reunión: ${state.punto}\n✨ Plan: ${state.plan.join(", ")}${state.comida.length ? `\n🍽️ Comida: ${state.comida.join(", ")}` : ""}\n\n¡Nos vemos! ❤️`;
}
function go(n){ state.step = n; if (n === 1) burst = 40; document.body.classList.toggle("final", n === 5); scrollTo(0,0); render(); }
render();

/* ---- corazones flotando ---- */
const cv = document.getElementById("hearts"), cx = cv.getContext("2d");
let W, H, hearts = [], burst = 0;
function size(){ W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
function add(fromBottom){
  const cols = ["#b8345a","#d58aa2","#c9b8d4","#ffffff"];
  hearts.push({ x: Math.random()*W, y: fromBottom ? H + 20 : Math.random()*H, s: (8 + Math.random()*16)*devicePixelRatio,
    v: (0.4 + Math.random()*1.2)*devicePixelRatio, w: Math.random()*6.28, c: cols[Math.floor(Math.random()*cols.length)], a: .35 + Math.random()*.5 });
}
for (let i=0;i<22;i++) add(false);
function heart(x,y,s){
  cx.beginPath(); cx.moveTo(x, y + s*.3);
  cx.bezierCurveTo(x, y, x - s*.5, y, x - s*.5, y + s*.3);
  cx.bezierCurveTo(x - s*.5, y + s*.6, x, y + s*.8, x, y + s);
  cx.bezierCurveTo(x, y + s*.8, x + s*.5, y + s*.6, x + s*.5, y + s*.3);
  cx.bezierCurveTo(x + s*.5, y, x, y, x, y + s*.3); cx.fill();
}
function tick(){
  cx.clearRect(0,0,W,H);
  if (burst > 0) { add(true); burst--; }
  if (hearts.length < 22) add(true);
  hearts = hearts.filter(h => h.y > -60);
  for (const h of hearts){
    if (!reduce){ h.y -= h.v; h.w += .02; }
    cx.globalAlpha = h.a; cx.fillStyle = h.c; heart(h.x + Math.sin(h.w)*12, h.y, h.s);
  }
  cx.globalAlpha = 1;
  if (!reduce) requestAnimationFrame(tick);
}
tick();
</script>
